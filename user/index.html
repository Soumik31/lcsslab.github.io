<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LCSS - User Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 960px; margin:20px auto;">

    <!-- nav -->
    <nav class="navbar navbar-expand-sm bg-warning navbar-dark">
        <ul class="navbar-nav">
            <li class="active nav-item">
                <a class="nav-link text-primary" href="index.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="contact.html">Contact</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto">
            <!-- Dropdown -->
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-primary" href="profile.html" id="navbardrop" data-toggle="dropdown">
                    <span id="nav-username"></span>
                </a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="profile.html">Profile</a>
                    <a class="dropdown-item" href="orders.html">Previous orders</a>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-item nav-link text-primary active" href="cart.html">
                    <i class="fas fa-shopping-cart"></i> Cart
                    <span id="cart_count" class="text-warning bg-light">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="#" onclick="userLogout(); return false;">Logout</a>
            </li>
        </ul>
    </nav>
    <br>

    <!-- Slider -->
    <div id="slider" style="width: 715px; margin-top:50px; float: left; border:1px solid black;">
        <img src="../img/home01.jpg" width="710px" height="240" alt="Home Banner">
    </div>

    <!-- Category Sidebar -->
    <div style="width: 240px; margin-top:50px; float: right;">
        <ul>
            <legend>CATEGORY</legend>
            <a href="laptop.html">PCs &amp; Laptops</a><hr>
            <a href="phone.html">Phones</a><hr>
            <a href="music.html">Music</a><hr>
        </ul>
    </div>

    <!-- Search Box -->
    <div style="width: 100%; margin-top:15px; float:left">
        <input type="text" id="searchBox" placeholder="Search Product" size="90px">
        <span style="margin-left:-4px"><input type="button" value="Search" onclick="searchProducts()"></span>
    </div>

    <!-- Product Grid -->
    <div class="container">
        <div class="row text-center py-5" id="product-grid">
            <!-- Products loaded dynamically -->
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
    // Auth check
    requireUserAuth();

    // Display username and cart count
    document.getElementById('nav-username').textContent = getCurrentUser();
    document.getElementById('cart_count').textContent = getCartCount();

    // Load products
    async function loadProducts() {
        var { data, error } = await supabase
            .from('producttb')
            .select('*');

        if (error) {
            showError('Failed to load products: ' + error.message);
            return;
        }

        renderProducts(data);
    }

    function renderProducts(products) {
        var grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        if (!products || products.length === 0) {
            grid.innerHTML = '<p>No products found.</p>';
            return;
        }

        products.forEach(function(product) {
            var imgSrc = '../' + product.product_image;
            var card = document.createElement('div');
            card.className = 'col-md-3 col-sm-6 my-3 my-md-0';
            card.innerHTML = 
                '<div class="card shadow">' +
                    '<div>' +
                        '<img src="' + imgSrc + '" class="img-fluid card-img-top" alt="' + product.product_name + '">' +
                    '</div>' +
                    '<div class="card-body">' +
                        '<h5 class="card-title">' + product.product_name + '</h5>' +
                        '<h6>' +
                            '<i class="fas fa-star"></i>' +
                            '<i class="fas fa-star"></i>' +
                            '<i class="fas fa-star"></i>' +
                            '<i class="fas fa-star"></i>' +
                            '<i class="far fa-star"></i>' +
                        '</h6>' +
                        '<h5><span class="price">\u20AC' + product.product_price + '</span></h5>' +
                        '<p class="card-text">Available: <span class="price">' + product.product_quan + '</span></p>' +
                        '<button class="btn btn-warning my-3" onclick="handleAddToCart(' + product.id + ')">Add to Cart <i class="fas fa-shopping-cart"></i></button>' +
                    '</div>' +
                '</div>';
            grid.appendChild(card);
        });
    }

    function handleAddToCart(productId) {
        var added = addToCart(productId);
        if (added) {
            document.getElementById('cart_count').textContent = getCartCount();
        } else {
            alert('Product is already added in the cart..!');
        }
    }

    function searchProducts() {
        var query = document.getElementById('searchBox').value.trim().toLowerCase();
        var cards = document.querySelectorAll('#product-grid .col-md-3');
        cards.forEach(function(card) {
            var title = card.querySelector('.card-title').textContent.toLowerCase();
            if (title.indexOf(query) !== -1 || query === '') {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });
    }

    loadProducts();
</script>
</body>
</html>
