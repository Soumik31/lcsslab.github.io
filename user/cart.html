<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LCSS - My Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 960px; margin:20px auto;">

    <!-- nav -->
    <nav class="navbar navbar-expand-sm bg-warning navbar-dark">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link text-primary" href="index.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="contact.html">Contact</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-primary" href="profile.html" id="navbardrop" data-toggle="dropdown">
                    <span id="nav-username"></span>
                </a>
                <div class="dropdown-menu">
                    <a class="dropdown-item" href="profile.html">Profile</a>
                    <a class="dropdown-item" href="orders.html">Previous orders</a>
                </div>
            </li>
            <li class="nav-item">
                <a class="nav-item nav-link text-primary active" href="cart.html">
                    <i class="fas fa-shopping-cart"></i> Cart
                    <span id="cart_count" class="text-warning bg-light">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="#" onclick="userLogout(); return false;">Logout</a>
            </li>
        </ul>
    </nav>
    <br>

    <!-- Cart Content -->
    <div style="width: 100%; margin-top:0px; float: left;" class="col-md-7">
        <div class="shopping-cart">
            <h6>My Cart</h6>
            <hr>
            <div id="cart-items">
                <!-- Cart items loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Price Details -->
    <div style="width: 35%; margin-top:0px; float: right;" class="col-md-4 offset-md-1 border rounded mt-5 bg-white h-25">
        <div class="pt-4">
            <h6>PRICE DETAILS</h6>
            <hr>
            <div class="row price-details">
                <div class="col-md-6">
                    <h6 id="price-item-count">Price (0 items)</h6>
                    <h6>Delivery Charges</h6>
                    <hr>
                    <h6>Amount Payable</h6>
                </div>
                <div class="col-md-6">
                    <h6 id="price-total">&euro;0</h6>
                    <h6 class="text-success">FREE</h6>
                    <hr>
                    <h6 id="price-payable">&euro;0</h6>
                    <a href="checkout.html" class="btn btn-info" style="margin-bottom:10px;" id="buy-now-btn">Buy Now</a>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
    // Auth check
    requireUserAuth();

    // Display username and cart count
    document.getElementById('nav-username').textContent = getCurrentUser();
    document.getElementById('cart_count').textContent = getCartCount();

    // Load cart items
    async function loadCart() {
        var cart = getCart();
        var cartItemsDiv = document.getElementById('cart-items');

        if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<h5>Cart is Empty</h5>';
            document.getElementById('buy-now-btn').style.display = 'none';
            return;
        }

        var { data, error } = await supabase
            .from('producttb')
            .select('*')
            .in('id', cart);

        if (error) {
            showError('Failed to load cart items: ' + error.message);
            return;
        }

        var total = 0;
        cartItemsDiv.innerHTML = '';

        data.forEach(function(product) {
            var imgSrc = '../' + product.product_image;
            total += parseInt(product.product_price);

            var itemDiv = document.createElement('div');
            itemDiv.className = 'cart-items';
            itemDiv.innerHTML = 
                '<div class="border rounded">' +
                    '<div class="row bg-white">' +
                        '<div class="col-md-3 pl-0">' +
                            '<img src="' + imgSrc + '" alt="' + product.product_name + '" class="img-fluid">' +
                        '</div>' +
                        '<div class="col-md-6">' +
                            '<h5 class="pt-2">' + product.product_name + '</h5>' +
                            '<h5 class="pt-2">\u20AC' + product.product_price + '</h5>' +
                            '<button class="btn btn-danger mx-2" onclick="handleRemove(' + product.id + ')">Remove</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            cartItemsDiv.appendChild(itemDiv);
        });

        // Update price details
        document.getElementById('price-item-count').textContent = 'Price (' + data.length + ' items)';
        document.getElementById('price-total').textContent = '\u20AC' + total;
        document.getElementById('price-payable').textContent = '\u20AC' + total;
    }

    function handleRemove(productId) {
        removeFromCart(productId);
        document.getElementById('cart_count').textContent = getCartCount();
        loadCart();
    }

    loadCart();
</script>
</body>
</html>
