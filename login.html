    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div style="width: 960px; margin:20px auto;">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-sm bg-warning navbar-dark">
        <ul class="navbar-nav">
            <li class="active nav-item">
                <a class="nav-link text-primary" href="index.html">Home</a>
            </li>
            <li class="nav-item">

            <li class="nav-item">

            </li>
        </ul>

<div style="width: 960px; margin:20px auto;">
    <div>
        <h1 align="center">Login</h1>
        <h4 align="center" id="error-message" class="text-danger"></h4>
    </div>

    <!-- Login Form -->
    <div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div align="center">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" /><br><br>
            </div>
            <div align="center">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" />
            </div>
            <div align="center" style="margin-top:20px;">
                <input type="submit" value="Login">
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
async function handleLogin(e) {
    e.preventDefault();
    var errorMsg = document.getElementById('error-message');
    errorMsg.textContent = '';

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();

    if (!username || !password) {
        errorMsg.textContent = 'You cannot login with an empty input';
        return;
    }

    var { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('username', username)
        .eq('password', password);

    if (error) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        console.error(error);
        return;
    }

    if (data && data.length > 0) {
        sessionStorage.setItem('lcss_user', username);
        window.location.href = 'user/index.html';
    } else {
        errorMsg.textContent = 'Please enter correct username and password';
    }
}
</script>
</body>
</html>
