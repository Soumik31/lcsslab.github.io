<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - LCSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
</head>
<body bgcolor="#E6E6FA">
    <div style="width: 960px; margin:20px auto;">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm bg-success navbar-dark">
            <ul class="navbar-nav">
                <li class="active nav-item">
                    <a class="nav-link text-light" href="index.html">Home</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="adminName"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#" onclick="adminLogout()">Logout</a>
                </li>
            </ul>
        </nav>

    </div>

    <div style="width: 960px; margin:20px auto;">
        <div style="width: 100%; margin:20px auto;">

            <!-- Side nav -->
            <div style="width: 25%; margin-top:0px; float: left;">
                <ul>
                    <a href="index.html">Dashboard</a><hr>
                    <a href="orders.html">Orders</a><hr>
                    <a href="reports.html">Reports</a><hr>
                    <a href="products.html">View Product</a><hr>
                    <a href="add_product.html">Add Product</a><hr>
                    <a href="users.html">Users</a><hr>
                </ul>
            </div>

            <!-- Main Content -->
            <div align="center" style="width: 75%; float: left;">
                <h1>WELCOME TO ADMIN DASHBOARD</h1>
                <br>
                <div class="row" style="margin-top: 20px;">
                    <div class="col-md-4">
                        <div class="card bg-primary text-white mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Total Products</h5>
                                <h2 id="totalProducts">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-info text-white mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Total Users</h5>
                                <h2 id="totalUsers">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-warning text-white mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Total Orders</h5>
                                <h2 id="totalOrders">0</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Require admin auth
        requireAdminAuth();

        // Display admin username
        document.getElementById('adminName').textContent = getAdminUser();

        // Load dashboard counts
        async function loadDashboard() {
            // Total products
            var { data: products, error: prodErr } = await supabase
                .from('producttb')
                .select('id', { count: 'exact', head: true });
            if (!prodErr) {
                var { count: productCount } = await supabase
                    .from('producttb')
                    .select('*', { count: 'exact', head: true });
                document.getElementById('totalProducts').textContent = productCount || 0;
            }

            // Total users
            var { count: userCount } = await supabase
                .from('users')
                .select('*', { count: 'exact', head: true });
            document.getElementById('totalUsers').textContent = userCount || 0;

            // Total orders
            var { count: orderCount } = await supabase
                .from('orders')
                .select('*', { count: 'exact', head: true });
            document.getElementById('totalOrders').textContent = orderCount || 0;
        }

        loadDashboard();
    </script>
</body>
</html>
