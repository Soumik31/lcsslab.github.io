<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - LCSS Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
</head>
<body bgcolor="#E6E6FA">
    <div style="width: 960px; margin:20px auto;">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm bg-success navbar-dark">
            <ul class="navbar-nav">
                <li class="active nav-item">
                    <a class="nav-link text-light" href="index.html">Home</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="adminName"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#" onclick="adminLogout()">Logout</a>
                </li>
            </ul>
        </nav>

    </div>

    <div style="width: 960px; margin:20px auto;">
        <div style="width: 100%; margin:20px auto;">

            <!-- Side nav -->
            <div style="width: 25%; margin-top:0px; float: left;">
                <ul>
                    <a href="index.html">Dashboard</a><hr>
                    <a href="orders.html">Orders</a><hr>
                    <a href="reports.html">Reports</a><hr>
                    <a href="products.html">View Product</a><hr>
                    <a href="add_product.html">Add Product</a><hr>
                    <a href="users.html">Users</a><hr>
                </ul>
            </div>

            <!-- Main Content -->
            <div style="width: 75%; float: left;">
                <div align="center" style="width: 100%;">
                    <h1>Users</h1>
                </div>

                <div style="width: 100%;">
                    <table class="table table-bordered">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Gender</th>
                            <th>Date of Birth</th>
                        </tr>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Require admin auth
        requireAdminAuth();

        // Display admin username
        document.getElementById('adminName').textContent = getAdminUser();

        // Load users
        async function loadUsers() {
            var { data, error } = await supabase
                .from('users')
                .select('*');

            if (error) {
                showError('Failed to load users: ' + error.message);
                return;
            }

            var tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (data && data.length > 0) {
                for (var i = 0; i < data.length; i++) {
                    var row = data[i];
                    tbody.innerHTML += '<tr>' +
                        '<td>' + row.id + '</td>' +
                        '<td>' + (row.name || '') + '</td>' +
                        '<td>' + (row.email || '') + '</td>' +
                        '<td>' + (row.username || '') + '</td>' +
                        '<td>' + (row.gender || '') + '</td>' +
                        '<td>' + (row.dob || '') + '</td>' +
                        '</tr>';
                }
            }
        }

        loadUsers();
    </script>
</body>
</html>
