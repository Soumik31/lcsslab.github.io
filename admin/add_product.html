<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product - LCSS Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
</head>
<body bgcolor="#E6E6FA">
    <div style="width: 960px; margin:20px auto;">

        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm bg-success navbar-dark">
            <ul class="navbar-nav">
                <li class="active nav-item">
                    <a class="nav-link text-light" href="index.html">Home</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="adminName"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#" onclick="adminLogout()">Logout</a>
                </li>
            </ul>
        </nav>

    </div>

    <div style="width: 960px; margin:20px auto;">
        <div style="width: 100%; margin:20px auto;">

            <!-- Side nav -->
            <div style="width: 25%; margin-top:0px; float: left;">
                <ul>
                    <a href="index.html">Dashboard</a><hr>
                    <a href="orders.html">Orders</a><hr>
                    <a href="reports.html">Reports</a><hr>
                    <a href="products.html">View Product</a><hr>
                    <a href="add_product.html">Add Product</a><hr>
                    <a href="users.html">Users</a><hr>
                </ul>
            </div>

            <!-- Main Content -->
            <div style="width: 75%; float: left;">
                <div align="center" style="width: 100%;">
                    <h1>ADD PRODUCT</h1>
                </div>

                <div id="messageArea"></div>

                <div>
                    <form id="addProductForm" onsubmit="return handleAddProduct(event)">
                        <div style="float: left; margin-left:132px;">
                            <div>
                                <label>Product Name</label><br>
                                <input type="text" name="title" id="title" size="57px">
                            </div>
                            <br>
                            <div>
                                <label>Product Description</label><br>
                                <textarea name="des" id="des" rows="5" cols="14" style="width: 430px; height: 48px;"></textarea>
                            </div>
                            <div style="margin-top:15px;">
                                <label>Product Price</label><br>
                                <input type="text" name="price" id="price" size="25px">
                            </div>
                            <div style="margin-top:15px;">
                                <label>Product Category</label><br>
                                <select name="cat" id="cat" style="width: 200px; height: 30px;">
                                    <option value="">-- Select Category --</option>
                                    <option value="Laptop">Laptop</option>
                                    <option value="Phones">Phones</option>
                                    <option value="Music">Music</option>
                                </select>
                            </div>
                            <div style="margin-top:15px;">
                                <label>Product Quantity</label><br>
                                <input type="text" name="quan" id="quan" size="25px">
                            </div>
                            <div style="margin-top:15px;">
                                <label>Product Image URL</label><br>
                                <input type="text" name="img" id="img" size="57px">
                            </div>
                            <div style="margin-top:15px;">
                                <label>Date</label><br>
                                <input type="date" name="date" id="date">
                            </div>
                            <div align="center" style="margin-top:30px;">
                                <input type="submit" name="submit" value="Add Product">
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Require admin auth
        requireAdminAuth();

        // Display admin username
        document.getElementById('adminName').textContent = getAdminUser();

        async function handleAddProduct(event) {
            event.preventDefault();
            var messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = '';

            var title = document.getElementById('title').value;
            var des = document.getElementById('des').value;
            var price = document.getElementById('price').value;
            var cat = document.getElementById('cat').value;
            var quan = document.getElementById('quan').value;
            var img = document.getElementById('img').value;
            var date = document.getElementById('date').value;

            // Validate
            if (!title || title.trim() === '') {
                messageArea.innerHTML = '<div class="alert alert-danger">Product name cannot be empty</div>';
                return false;
            }

            // Insert into producttb via Supabase
            var { data, error } = await supabase
                .from('producttb')
                .insert([{
                    product_name: title,
                    product_des: des,
                    product_price: price,
                    product_cat: cat,
                    product_quan: quan,
                    product_image: img,
                    product_date: date
                }]);

            if (error) {
                messageArea.innerHTML = '<div class="alert alert-danger">Failed to add product: ' + error.message + '</div>';
            } else {
                messageArea.innerHTML = '<div class="alert alert-success">Product added successfully!</div>';
                setTimeout(function() {
                    window.location.href = 'products.html';
                }, 1500);
            }
            return false;
        }
    </script>
</body>
</html>
