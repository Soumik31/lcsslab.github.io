<div style="width: 960px; margin:20px auto;">
    <!-- Slider -->
    <div id="slider" style="width: 715px; margin-top:50px; float: left; border:1px solid black;">
        <img src="./img/home01.jpg" width="710px" height="240" />

        </ul>

    <!-- Search Box -->
    <div style="width: 100%; margin-top:15px; float:left">
        <input type="text" id="searchBox" placeholder="Search Product" size="90px" oninput="filterProducts()">
        <span style="margin-left:-4px"><input type="button" value="Search" onclick="filterProducts()"></span>
    </div>

    <!-- Product Grid -->
    <div class="container">
        <div class="row text-center py-5" id="product-grid">
            <!-- Products loaded dynamically -->

    </div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
var allProducts = [];

async function loadProducts() {
    var { data, error } = await supabase
        .from('producttb')
        .select('*');

    if (error) {
        console.error('Error loading products:', error);
        return;
    }

    allProducts = data || [];
    renderProducts(allProducts);
}

function renderProducts(products) {
    var grid = document.getElementById('product-grid');
    grid.innerHTML = '';

    if (products.length === 0) {
        grid.innerHTML = '<p class="text-center w-100">No products found.</p>';
        return;
    }

    products.forEach(function(product) {
        var card = '<div class="col-md-3 col-sm-6 my-3 my-md-0">' +
            '<div class="card shadow">' +
            '<img src="' + product.product_image + '" class="img-fluid card-img-top">' +
            '<div class="card-body">' +
            '<h5 class="card-title">' + product.product_name + '</h5>' +
            '<h6><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i></h6>' +
            '<h5><span class="price">€' + product.product_price + '</span></h5>' +
            '<p class="card-text">Available: <span class="price">' + product.product_quan + '</span></p>' +
            '<button onclick="handleAddToCart(' + product.id + ')" class="btn btn-warning my-3">Add to Cart <i class="fas fa-shopping-cart"></i></button>' +
            '</div></div></div>';
        grid.innerHTML += card;
    });
}

function filterProducts() {
    var query = document.getElementById('searchBox').value.toLowerCase();
    var filtered = allProducts.filter(function(product) {
        return product.product_name.toLowerCase().indexOf(query) !== -1;
    });
    renderProducts(filtered);
}

function handleAddToCart(productId) {
    var added = addToCart(productId);
    if (added) {
        alert('Product added to cart!');
    } else {
        alert('Product is already in the cart.');
    }
}

loadProducts();
</script>
</body>
